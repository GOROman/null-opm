name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build }} --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DNULLOPM_BUILD_TESTS=OFF -DNULLOPM_BUILD_TOOLS=OFF -DNULLOPM_BUILD_EXAMPLES=OFF
      - run: cmake --build build-wasm --parallel

  format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y clang-format
      - run: clang-format --dry-run --Werror src/*.cpp src/nullopm/*.hpp src/nullopm/*.h
